services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quienlodijo
      POSTGRES_USER: quienlodijo
      POSTGRES_PASSWORD: quienlodijo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quienlodijo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/quienlodijo
      DATABASE_USERNAME: quienlodijo
      DATABASE_PASSWORD: quienlodijo
      # Secreto de desarrollo/pruebas locales SOLO para este docker-compose; en un
      # despliegue real se inyecta uno propio y no se commitea (plan.md §7).
      JWT_SECRET: docker-compose-dev-secret-do-not-use-in-production-1234567890
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080" # opcional, útil para depurar el backend directamente

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
