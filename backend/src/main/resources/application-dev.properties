# Perfil de desarrollo local: base de datos H2 en memoria (plan.md, Fase 0 / T001).

spring.datasource.url=jdbc:h2:mem:quienlodijo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secreto de firma JWT SOLO para desarrollo local (>= 32 bytes, requerido por HS256).
# NUNCA usar este valor en producción: allí se inyecta vía la variable de entorno JWT_SECRET
# (ver application-prod.properties).
app.jwt.secret=dev-only-secret-do-not-use-in-production-1234567890
