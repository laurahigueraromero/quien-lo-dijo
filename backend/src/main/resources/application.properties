spring.application.name=backend

# Perfil activo por defecto en desarrollo local (H2 en memoria).
# En despliegue real se sobreescribe con SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# JWT (plan.md §7, T005-T006). El secreto se define por perfil (ver
# application-dev.properties / application-prod.properties); aquí solo la
# expiración por defecto.
app.jwt.expiration-minutes=60
