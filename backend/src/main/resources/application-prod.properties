# Perfil de producción: PostgreSQL, configurado vía variables de entorno
# (plan.md §1). No se commitean credenciales: se inyectan en el entorno real.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# NOTA: para un MVP se deja en 'update' por simplicidad. Antes de un uso en
# producción real conviene introducir Flyway/Liquibase y pasar esto a 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
