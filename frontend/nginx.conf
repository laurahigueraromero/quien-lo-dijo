server {
    listen 80;
    server_name _;

    # REST hacia el backend (red interna de Docker, sin CORS: mismo origen desde
    # el punto de vista del navegador, sea cual sea el host/IP con el que se acceda).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (STOMP/SockJS) hacia el backend; cabeceras de upgrade obligatorias.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # SPA de React: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario para las rutas de React Router, ej. /rooms/ABC123).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
